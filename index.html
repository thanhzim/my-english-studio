ù hợp: leaving. Các lựa chọn khác không tương đương.", "full": "departure = sự khởi hành.", "tag": "Synonyms"}, {"id": "u2-v0-gen", "type": "card", "prompt": "The departure was delayed.", "translation": "Chuyến khởi hành bị hoãn.", "answer": "departure", "explanation": "“departure” = sự khởi hành; gần nghĩa: leaving.", "full": "Chuyến khởi hành bị hoãn.", "tag": "General English"}, {"id": "u2-v0-fnb", "type": "card", "prompt": "The supplier confirmed the departure time.", "translation": "Nhà cung cấp xác nhận giờ khởi hành.", "answer": "departure", "explanation": "“departure” = sự khởi hành; gần nghĩa: leaving.", "full": "Nhà cung cấp xác nhận giờ khởi hành.", "tag": "Restaurant English"}, {"id": "u2-v1-syn", "type": "mc", "prompt": "Which option is closest in meaning to “destination”?", "translation": "Từ nào gần nghĩa nhất với “destination” (điểm đến)?", "options": ["end point", "unrelated", "opposite", "uncertain"], "answer": 0, "explanation": "“destination” nghĩa là điểm đến. Từ gần nghĩa trong ngữ cảnh phù hợp: end point. Các lựa chọn khác không tương đương.", "full": "destination = điểm đến.", "tag": "Synonyms"}, {"id": "u2-v1-gen", "type": "card", "prompt": "Our destination is Hanoi.", "translation": "Điểm đến của chúng tôi là Hà Nội.", "answer": "destination", "explanation": "“destination” = điểm đến; gần nghĩa: end point.", "full": "Điểm đến của chúng tôi là Hà Nội.", "tag": "General English"}, {"id": "u2-v1-fnb", "type": "card", "prompt": "The destination for this delivery is our restaurant.", "translation": "Điểm đến của chuyến giao hàng này là nhà hàng của chúng tôi.", "answer": "destination", "explanation": "“destination” = điểm đến; gần nghĩa: end point.", "full": "Điểm đến của chuyến giao hàng này là nhà hàng của chúng tôi.", "tag": "Restaurant English"}, {"id": "u2-v2-syn", "type": "mc", "prompt": "Which option is closest in meaning to “delay”?", "translation": "Từ nào gần nghĩa nhất với “delay” (sự chậm trễ; trì hoãn)?", "options": ["postpone", "unr posite", "uncertain"], "answer": 0, "explanation": "“accommodation” nghĩa là chỗ ở. Từ gần nghĩa trong ngữ cảnh phù hợp: lodging. Các lựa chọn khác không tương đương.", "full": "accommodation = chỗ ở.", "tag": "Synonyms"}, {"id": "u2-v4-gen", "type": "card", "prompt": "We booked accommodation early.", "translation": "Chúng tôi đặt chỗ ở sớm.", "answer": "accommodation", "explanation": "“accommodation” = chỗ ở; gần nghĩa: lodging.", "full": "Chúng tôi đặt chỗ ở sớm.", "tag": "General English"}, {"id": "u2-v4-fnb", "type": "card", "prompt": "The chef arranged accommodation for the visiting team.", "translation": "Bếp trưởng sắp xếp chỗ ở cho đoàn đến thăm.", "answer": "accommodation", "explanation": "“accommodation” = chỗ ở; gần nghĩa: lodging.", "full": "Bếp trưởng sắp xếp chỗ ở cho đoàn đến thăm.", "tag": "Restaurant English"}, {"id": "u2-v5-syn", "type": "mc", "prompt": "Which option is closest in meaning to “commute”?", "translation": "Từ nào gần nghĩa nhất với “commute” (đi lại hằng ngày)?", "options": ["travel to work", "unrelated", "opposite", "uncertain"], "answer": 0, "explanation": "“commute” nghĩa là đi lại hằng ngày. Từ gần nghĩa trong ngữ cảnh phù hợp: travel to work. Các lựa chọn khác không tương đương.", "full": "commute = đi lại hằng ngày.", "tag": "Synonyms"}, {"id": "u2-v5-gen", "type": "card", "prompt": "My commute takes thirty minutes.", "translation": "Tôi mất ba mươi phút đi làm.", "answer": "commute", "explanation": "“commute” = đi lại hằng ngày; gần nghĩa: travel to work.", "full": "Tôi mất ba mươi phút đi làm.", "tag": "General English"}, {"id": "u2-v5-fnb", "type": "card", "prompt": "Her commute to the restaurant is short.", "translation": "Quãng đường cô ấy đi làm đến nhà hàng ngắn.", "answer": "commute", "explanation": "“commute” = đi lại hằng ngày; gần nghĩa: travel to work.", "full": "Quãng đường cô ấy đi làm đến nhà hàng ngắn.", "tag": "Restaurant English"}], "3": [{"id": "u3-g0", "type": "mc", "prompt": "When the guests arrived, we ___ function home(){let completed=Object.values(saved).reduce((n,p)=>n+(p.done?.length||0),0);$('app').innerHTML=`<section class="hero"><div><h1>LEARN.<br>PRACTICE.<br>GROW.</h1><p>Học tiếng Anh B2 theo 28 Unit của Destination B2, kết hợp tiếng Anh đời sống và ngành nhà hàng. Mọi câu đều có dịch đề và lời giải.</p><button class="primary" onclick="view('units')">BẮT ĐẦU HỌC →</button></div><div class="drawing">${art()}</div></section><section class="blueband"><h2>YOUR LEARNING TOOLS</h2><div class="pills"><span>28 Units</span><span>14 Reviews theo cặp Unit</span><span>Grammar</span><span>Vocabulary</span><span>English ↔ Vietnamese</span><span>Restaurant contexts</span></div></section><section class="section"><h2>CONTINUE LEARNING</h2><div class="statrow"><div class="stat"><strong>${completed}</strong><span>Câu đã hoàn thành</span></div><div class="stat"><strong>${Object.values(QUESTIONS).reduce((a,b)=>a+b.length,0)}</strong><span>Câu gốc trong bản này</span></div><div class="stat"><strong>28</strong><span>Unit có thể chọn</span></div></div><p class="note">Đây là phiên bản học được ngay với ngân hàng câu hỏi khởi đầu. Chưa có 500 câu độc lập mỗi Unit hay AI dịch câu bất kỳ.</p><div class="controls"><button class="primary" onclick="start(1)">Học Unit 1</button><button onclick="view('units')">Xem toàn bộ Unit</button><button onclick="view('words')">Học từ vựng</button></div></section>`}
function units(){let out=`<section class="section"><h2>DESTINATION B2 — 28 UNITS</h2><p class="muted">Giữ thứ tự Grammar / Vocabulary như mục lục sách. Bài tập và bản dịch do My English Studio tự biên soạn.</p><div class="grid">`;UNITS.forEach((u,j)=>{let n=j+1,p=progress(n),total=QUESTIONS[n].length;out+=`<div class="card"><div class="unitnum">UNIT ${String(n).padStart(2,'0')} · ${esc(u[0]).toUpperCase()}</div><h3>${esc(u[1])}</h3><p>🍽 ${esc(u[2])}</p><p>${p.done?.length||0}/${total} câu đã thử</p><div class="bar"><div style="width:${Math.round(100*(p.done?.length||0)/total)}%"></div></div><div class="controls"><button class="primary" onclick="start(${n})">Học Unit ${n}</button><button onclick="review(${n})">Ôn sai</button></div></div>`;if(n%2===0)out+=`<div class="card"><div class="unitnum">REVIEW ${n/2}</div><h3>Units ${n-1} & ${n}</h3><p>Ôn tổng hợp hai Unit bằng câu đã học.</p><button onclick="reviewPair(${n-1},${n})">Làm Review</button></div>`});$('app').innerHTML=out+'</div></section>'}
function start(n,mode='all'){state.unit=n;state.mode=mode;let all=QUESTIONS[n].map((_,i)=>i);let p=progress(n);if(mode==='wrong')all=all.filter(i=>p.wrong?.includes(QUESTIONS[n][i].id));if(mode==='new')all=all.filter(i=>!p.done?.includes(QUESTIONS[n][i].id));state.order=all;state.idx=0;renderQ()}
function renderQ(){let n=state.unit,u=UNITS[n-1],list=state.order;if(!list.length){$('app').innerHTML=`<section class="panel"><h2>${state.mode==='wrong'?'Không có câu sai cần ôn':'Đã hoàn thành phần câu hỏi hiện có!'}</h2><p>Chọn một Unit khác hoặc ôn lại. Ngân hàng câu hỏi sẽ tiếp tục được bổ sung trong các bản cập nhật.</p><button onclick="view('units')">Chọn Unit khác</button><button onclick="start(${n})">Làm lại Unit</button></section>`;return}if(state.idx>=list.length){$('app').innerHTML=`<section class="panel"><h2>HOÀN THÀNH BÀI HỌC 🎉</h2><p>Đã đi hết ${list.length} câu trong lượt này.</p><div class="controls"><button class="primary" onclick="start(${n},'wrong')">Ôn câu sai</button><button onclick="start(${n},'new')">Làm câu chưa học</button><button onclick="start(${n+1>28?1:n+1})">Unit tiếp theo →</button><button onclick="view('units')">Tất cả Unit</button></div></section>`;return}let q=QUESTIONS[n][list[state.idx]];state.answered=false;state.selected=-1;let p=progress(n);$('app').innerHTML=`<section class="section"><div class="unitnum">UNIT ${n} · ${esc(u[0])} · ${esc(u[1])}</div><h2>QUESTION ${state.idx+1} / ${list.length}</h2><div class="bar"><div style="width:${100*state.idx/list.length}%"></div></div><div class="controls"><button onclick="view('units')">← Danh sách Unit</button><button onclick="start(${n},'new')">Câu chưa học</button><button onclick="start(${n},'wrong')">Ôn sai (${p.wrong?.length||0})</button></div><div class="panel"><span class="tag">${esc(q.tag)}</span><p class="prompt">${esc(q.prompt)}</p><p class="translation"><b>Dịch đề:</b> ${esc(q.translation)}</p><div id="answers">${q.type==='mc'?q.options.map((x,k)=>`<button class="option" onclick="answer(${k})">${'ABCD'[k]}. ${esc(x)}</button>`).join(''):`<p class="note">Đọc câu tiếng Anh và tự nhớ nghĩa. Bấm xem giải thích để kiểm tra.</p><button class="primary" onclick="answer(0)">Xem giải thích & ghi nhớ</button>`}</div><div id="explain"></div></div><div class="controls"><button id="next" class="primary hide" onclick="nextQ()">Câu tiếp theo →</button><button onclick="saveWord(${n},${list[state.idx]})">☆ Lưu vào sổ ôn</button></div></section>`}
function answer(k){if(state.answered)return;let n=state.unit,q=QUESTIONS[n][state.order[state.idx]],p=progress(n),correct=q.type==='card'||k===q.answer;state.answered=true;state.selected=k;if(!p.done)p.done=[];if(!p.wrong)p.wrong=[];if(!p.done.includes(q.id))p.done.push(q.id);if(correct){p.wrong=p.wrong.filter(id=>id!==q.id);p.right=(p.right||0)+1}else if(!p.wrong.includes(q.id))p.wrong.push(q.id);saved[n]=p;store();if(q.type==='mc'){Array.from($('answers').children).forEach((el,i)=>{el.disabled=true;if(i===q.answer)el.classList.add('correct');else if(i===k)el.classList.add('wrong')})}else $('answers').innerHTML=`<div class="tag">${esc(q.answer)}</div>`;$('explain').innerHTML=`<div class="feedback"><b>${correct?'✓ Đã xem đáp án':'✗ Chưa đúng'} — Đáp án: ${q.type==='mc'?'ABCD'[q.answer]+'. '+esc(q.options[q.answer]):esc(q.answer)}</b><p><b>Dịch câu hoàn chỉnh:</b> ${esc(q.full)}</p><p><b>Giải thích:</b> ${esc(q.explanation)}</p>${q.type==='mc'?`<p><b>Phân tích lựa chọn:</b> ${q.options.map((o,i)=>`<br>${'ABCD'[i]}. ${esc(o)} — ${i===q.answer?'Phù hợp với cấu trúc/nghĩa của câu.':'Không phù hợp với cấu trúc hoặc nghĩa yêu cầu trong câu này.'}`).join('')}</p>`:''}</div>`;$('next').classList.remove('hide')}
function nextQ(){state.idx++;renderQ();window.scrollTo({top:0,behavior:'smooth'})}
function review(n){start(n,'wrong')}function reviewPair(a,b){let p1=progress(a),p2=progress(b);$('app').innerHTML=`<section class="panel"><h2>REVIEW — UNITS ${a} & ${b}</h2><p>Chọn một phần để ôn. Review phiên bản đầu dùng ngân hàng câu hiện có của từng Unit.</p><div class="controls"><button class="primary" onclick="start(${a})">Unit ${a}</button><button class="primary" onclick="start(${b})">Unit ${b}</button><button onclick="review(${a})">Ôn sai Unit ${a} (${p1.wrong?.length||0})</button><button onclick="review(${b})">Ôn sai Unit ${b} (${p2.wrong?.length||0})</button></div></section>`}
function saveWord(n,i){let q=QUESTIONS[n][i];saved.bookmarks=saved.bookmarks||[];if(!saved.bookmarks.some(x=>x.id===q.id))saved.bookmarks.push({id:q.id,prompt:q.prompt,translation:q.translation,explanation:q.explanation});store();alert('Đã lưu vào sổ ôn!')}
function words(){let out=`<section class="section"><h2>VOCABULARY NOTEBOOK</h2><p>Học từ vựng B2 đa dạng từ các Unit Vocabulary, kèm ví dụ đời sống và nhà hàng.</p><div class="controls"><select id="wordUnit" onchange="renderWords()">${Object.keys(VOCAB).map(n=>`<option value="${n}">Unit ${n} — ${esc(UNITS[n-1][1])}</option>`).join('')}</select></div><div id="wordCards"></div><h2>MY SAVED SENTENCES</h2><div id="bookmarks"></div></section>`;$('app').innerHTML=out;renderWords();$('bookmarks').innerHTML=(saved.bookmarks||[]).map(x=>`<div class="reviewrow"><b>${esc(x.prompt)}</b><p>${esc(x.translation)}</p><small>${esc(x.explanation)}</small></div>`).join('')||'<p>Chưa lưu câu nào.</p>'}
function renderWords(){let n=$('wordUnit').value;let words=VOCAB[n]||[];$('wordCards').innerHTML=`<div class="grid">${words.map(w=>`<div class="card"><span class="tag">${esc(w[0])}</span><h3>${esc(w[1])}</h3><p><b>Synonym:</b> ${esc(w[2])}</p><p><b>General:</b> ${esc(w[3])}<br><i>${esc(w[4])}</i></p><p><b>F&B:</b> ${esc(w[5])}<br><i>${esc(w[6])}</i></p></div>`).join('')}</div><p><button class="primary" onclick="start(${n})">Luyện Unit ${n} →</button></p>`}
function stats(){let done=0,wrong=0;for(let n=1;n<=28;n++){done+=(progress(n).done||[]).length;wrong+=(progress(n).wrong||[]).length}$('app').innerHTML=`<section class="section"><h2>MY PROGRESS</h2><div class="statrow"><div class="stat"><strong>${done}</strong>câu đã làm</div><div class="stat"><strong>${wrong}</strong>câu cần ôn</div><div class="stat"><strong>${(saved.bookmarks||[]).length}</strong>câu đã lưu</div></div><p class="note">Tiến độ được lưu trong bộ nhớ trình duyệt này. Nếu xóa dữ liệu Safari hoặc đổi máy, dữ liệu có thể mất. Hãy xuất bản sao định kỳ.</p><div class="controls"><button class="primary" onclick="exportData()">Tải bản sao tiến độ (.json)</button><button onclick="$('importFile').click()">Nhập bản sao</button><input class="hide" type="file" id="importFile" accept="application/json" onchange="importData(event)"></div><h2>BY UNIT</h2><div class="grid">${UNITS.map((u,i)=>{let p=progress(i+1);return `<div class="card"><b>Unit ${i+1} · ${esc(u[1])}</b><p>Đã làm ${(p.done||[]).length}/${QUESTIONS[i+1].length} · Sai ${(p.wrong||[]).length}</p><button onclick="start(${i+1})">Tiếp tục</button></div>`}).join('')}</div></section>`}
function exportData(){let blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-english-studio-progress.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(typeof obj!=='object'||!obj)throw Error();saved=obj;store();stats();alert('Đã nhập tiến độ')}catch{alert('File JSON không hợp lệ')}};reader.readAsText(f)}
home();
</script></body></html>
